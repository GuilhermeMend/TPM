<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turmas — Anuário Escolar 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/home.css">
    <link rel="stylesheet" href="../css/tema.css">
    <script>
        // Aplica o tema salvo ANTES da página desenhar, pra não piscar
        if (localStorage.getItem('tema') === 'escuro') {
            document.documentElement.setAttribute('data-tema', 'escuro');
        }
    </script>
</head>

<body>

    <!-- ========================
         HEADER
    ======================== -->
    <header>

        <div class="header-logo">
            <span class="logo-icon">🎓</span>
            <h1>Anuário Escolar</h1>
        </div>

        <nav>
            <a href="home.html">Início</a>
            <a href="turmas.html" class="ativo-nav">Turmas</a>
            <a href="fotos.html">Fotos</a>
            <a href="home.html#contato">Contato</a>
        </nav>

        <button class="btn-tema" id="btn-tema" onclick="alternarTema()" title="Alternar tema claro/escuro">🌙</button>
        <button class="btn-sair" onclick="window.location.href='login.html'">
            Sair
        </button>

    </header>

    <main>

        <!-- ========================
             TURMAS
        ======================== -->
        <section class="secao" id="turmas">

            <div class="secao-header">
                <h2>Turmas</h2>
                <p>Clique em uma turma para ver os alunos</p>
            </div>

            <div class="turmas-botoes" id="turmas-botoes">
                <p class="turma-alunos-vazio">Carregando turmas...</p>
            </div>

            <div class="turma-alunos-painel" id="turma-alunos-painel">
                <p class="turma-alunos-vazio">Selecione uma turma acima para ver os alunos.</p>
            </div>

        </section>


    </main>

    <!-- ========================
         FOOTER
    ======================== -->
    <footer>
        <p>© 2026 · Anuário Escolar · Todos os direitos reservados</p>
    </footer>


    <script src="../javascript/tema.js"></script>
    <script src="../javascript/comum.js"></script>
    <script src="../javascript/turmas.js"></script>

</body>
</html>
