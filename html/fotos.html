<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotos — Anuário Escolar 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/tema.css">
    <script>
        // Aplica o tema salvo ANTES da página desenhar, pra não piscar
        if (localStorage.getItem('tema') === 'escuro') {
            document.documentElement.setAttribute('data-tema', 'escuro');
        }
    </script>
</head>

<body data-acesso="aluno" style="visibility:hidden">

    <!-- ========================
         HEADER
    ======================== -->
    <header>

        <div class="header-logo">
            <span class="logo-icon">🎓</span>
            <h1>Anuário Escolar</h1>
        </div>

        <nav>
            <a href="home.html">Início</a>
            <a href="turmas.html">Turmas</a>
            <a href="fotos.html" class="ativo-nav">Fotos</a>
            <a href="home.html#contato">Contato</a>
        </nav>

        <button class="btn-tema" id="btn-tema" onclick="alternarTema()" title="Alternar tema claro/escuro">🌙</button>
        <button class="btn-sair" onclick="sair()">
            Sair
        </button>

    </header>

    <main>

        <!-- ========================
             FOTOS
        ======================== -->
        <section class="secao secao-clara" id="fotos">

            <div class="secao-header">
                <h2>Fotos</h2>
                <p>Veja as fotos publicadas e deixe seu comentário</p>
            </div>

            <div class="foto-galeria" id="foto-galeria">
                <p class="turma-alunos-vazio">Carregando fotos...</p>
            </div>

        </section>


    </main>

    <!-- ========================
         FOOTER
    ======================== -->
    <footer>
        <p>© 2026 · Anuário Escolar · Todos os direitos reservados</p>
    </footer>

    <!-- ========================
         MODAL — FOTO + COMENTÁRIOS
    ======================== -->
    <div class="modal-overlay" id="modal-foto">
        <div class="modal modal-foto">
            <div class="modal-header">
                <h3 id="foto-modal-legenda">Foto</h3>
                <button class="modal-fechar" onclick="fecharModal('modal-foto')">✕</button>
            </div>

            <img id="foto-modal-img" class="foto-modal-img" src="" alt="">

            <div class="comentarios-lista" id="comentarios-lista">
                <!-- Comentários gerados via JS -->
            </div>

            <div class="comentario-campo">
                <input type="text" id="comentario-texto" placeholder="Escreva um comentário..." maxlength="500">
                <button class="btn-enviar" onclick="enviarComentario()">Comentar</button>
            </div>
        </div>
    </div>


    <script src="../javascript/tema.js"></script>
    <script src="../javascript/comum.js"></script>
    <script src="../javascript/fotos.js"></script>

</body>
</html>
