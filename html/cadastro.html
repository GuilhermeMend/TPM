<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Anuário Escolar</title>

    <link rel="stylesheet" href="../css/cadastro.css">
</head>

<body data-acesso="gestao" style="visibility:hidden">

    <div class="login-container">

        <h1>Cadastrar aluno</h1>

        <!-- Nome -->
        <input
            type="text"
            placeholder="Nome completo"
            id="nome"
        >

        <!-- RA -->
        <input
            type="text"
            placeholder="RA do aluno"
            id="ra"
        >

        <!-- Turma (carregada do banco) -->
        <select id="turma">
            <option value="">Carregando turmas...</option>
        </select>

        <!-- Senha -->
        <input
            type="password"
            placeholder="Senha"
            id="senha"
        >

        <!-- Mensagem -->
        <h3 id="mensagem"></h3>


        <!-- Botão -->
        <button id="btnCadastro">
            Cadastrar
        </button>


        <!-- Voltar -->
        <div class="cadastro-link">

            <a href="gestao-turmas.html" class="btn-voltar">
                Voltar ao painel
            </a>

        </div>

    </div>


    <script src="../javascript/comum.js"></script>
    <script src="../javascript/cadastro.js"></script>

</body>

</html>
