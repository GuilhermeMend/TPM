<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="login-container">

        <h1>Login</h1>

        <!-- ESCOLHER TIPO -->
        <div class="tipo-login">

            <button class="tipo ativo" id="btnAluno">
                Aluno
            </button>

            <button class="tipo" id="btnAdmin">
                Gestão
            </button>

        </div>

        <h3 id="mensagem" style="color: red; text-shadow: 2px 2px 4px;"></h3>

        <input
            type="text"
            placeholder="Digite seu usuário"
            id="usuario"
        >

        <input
            type="password"
            placeholder="Digite sua chave"
            id="senha"
        >

        <!-- ESQUECI A SENHA -->
        <div class="esqueci-senha">
            <a href="#" onclick="abrirModalSenha(); return false;">Esqueci minha senha</a>
        </div>

        <button onclick="validarLogin()">
            Entrar
        </button>

        <!-- CADASTRO -->
        <div class="cadastro-link">
            <span>Não tem conta?</span>
            <a href="cadastro.html" class="btn-cadastro">Cadastrar</a>
        </div>

    </div>

    <!-- MODAL ESQUECI SENHA -->
    <div class="modal-overlay" id="modalSenha">
        <div class="modal-box">
            <h2>🔑 Recuperar Senha</h2>
            <p>Digite o e-mail ou usuário cadastrado. Você receberá as instruções de recuperação.</p>
            <input
                type="text"
                placeholder="E-mail ou usuário"
                id="inputRecuperacao"
            >
            <p class="modal-msg" id="modalMsg"></p>
            <button class="btn-enviar" onclick="enviarRecuperacao()">Enviar</button>
            <button class="btn-fechar" onclick="fecharModalSenha()">Cancelar</button>
        </div>
    </div>

    <script src="login.js"></script>

    <script>
        function abrirModalSenha() {
            document.getElementById('modalSenha').classList.add('ativo');
            document.getElementById('inputRecuperacao').value = '';
            document.getElementById('modalMsg').style.color = '';
            document.getElementById('modalMsg').textContent = '';
        }

        function fecharModalSenha() {
            document.getElementById('modalSenha').classList.remove('ativo');
        }

        function enviarRecuperacao() {
            const val = document.getElementById('inputRecuperacao').value.trim();
            const msg = document.getElementById('modalMsg');
            if (!val) {
                msg.style.color = 'rgb(248,113,113)';
                msg.textContent = 'Por favor, preencha o campo acima.';
                return;
            }
            msg.style.color = 'rgb(74,222,128)';
            msg.textContent = '✅ Instruções enviadas! Verifique seu e-mail.';
            setTimeout(fecharModalSenha, 2500);
        }

        // Fechar modal clicando fora
        document.getElementById('modalSenha').addEventListener('click', function(e) {
            if (e.target === this) fecharModalSenha();
        });
    </script>

</body>

</html>
