<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="login-container">

        <h1>Login</h1>

        <!-- ESCOLHER TIPO -->
        <div class="tipo-login">

            <button class="tipo ativo" id="btnAluno">
                Aluno
            </button>

            <button class="tipo" id="btnAdmin">
                Gestão
            </button>

        </div>

        <h3 id="mensagem" style="color: red; text-shadow: 2px 2px 4px;"></h3>

        <input
            type="text"
            placeholder="Digite seu usuário"
            id="usuario"
        >

        <input
            type="password"
            placeholder="Digite sua senha"
            id="senha"
        >

        <button onclick="validarLogin()">
            Entrar
        </button>

        <!-- ✅ NOVO: divisor + link para cadastro -->
        <div class="cadastro-link">
            <span>Não tem conta?</span>
            <a href="cadastro.html" class="btn-cadastro">Cadastrar</a>
        </div>

    </div>

    <script src="login.js"></script>

</body>

</html>
